<div>
  <a [routerLink]="['/users', user().id]" routerLinkActive="selected"> <!-- directive that sets up a path for this link and Angular blocks the browser's link and navigates to the path for us. -->
    <img [src]="imagePath()" [alt]="user().name" />
    <span>{{ user().name }}</span>
  </a>
</div>
